services:
  - type: web
    name: cybotics-tap-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: ""
      - key: USE_IN_MEMORY_DB
        value: "true"
      - key: CLIENT_URL
        value: "https://cybotics-tap.vercel.app" # Update this to your Vercel frontend URL
      - key: PUBLIC_GAME_URL
        value: "https://cybotics-tap.vercel.app" # Update this to your Vercel frontend URL
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: DEFAULT_EVENT_NAME
        value: "CYBOTICS FAIR 2026"
